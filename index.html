<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Quiz app</title>
</head>
<body>
    <main>
        <header>
            <h1>Welcome to the Quiz App</h1>
            <h3>Answer the following questions correctly, and get your score</h3>
        </header>
        <div class="card">
            <div class="toChange">To start your quiz, press the button below</div>
            <div class="button options">
                <button id="starter" class="toRemove">Start</button>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
